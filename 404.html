<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join LastHit</title>
  <meta name="description" content="Open this LastHit invite or download LastHit from the App Store.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #1c1210;
      --card: rgba(255, 255, 255, 0.08);
      --stroke: rgba(255, 255, 255, 0.14);
      --text: #fff8f2;
      --muted: rgba(255, 248, 242, 0.7);
      --accent: #f0a66f;
      --secondary: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 0%, rgba(240, 166, 111, 0.26), transparent 32%),
        radial-gradient(circle at 100% 100%, rgba(171, 116, 255, 0.12), transparent 30%),
        linear-gradient(145deg, #120d0d, var(--bg));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }

    main {
      width: min(460px, 100%);
      padding: 28px;
      border: 1px solid var(--stroke);
      border-radius: 30px;
      background: var(--card);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px);
    }

    .icon {
      width: 76px;
      height: 76px;
      display: block;
      border-radius: 20px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin: 22px 0 10px;
      font-size: 36px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
    }

    .code {
      margin: 0 0 18px;
      padding: 14px 16px;
      border: 1px solid var(--stroke);
      border-radius: 18px;
      color: var(--text);
      background: rgba(0, 0, 0, 0.18);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      overflow-wrap: anywhere;
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    a {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 54px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: 800;
      font-size: 17px;
    }

    .primary {
      color: #1d120d;
      background: var(--accent);
    }

    .secondary {
      color: var(--text);
      background: var(--secondary);
      border: 1px solid var(--stroke);
    }

    small {
      display: block;
      margin-top: 16px;
      color: rgba(255, 248, 242, 0.52);
      line-height: 1.4;
    }
  </style>
</head>

    <h1>You're invited to LastHit</h1>
    <p>Opening LastHit to join the group… If nothing happens, use a button below.</p>
    <div class="code" id="invite-code">Loading your invite…</div>
    <div class="actions">
      <a class="primary" id="open-link" href="https://apps.apple.com/app/id6785927095">Open in LastHit</a>
      <a class="secondary" id="download-link" href="https://apps.apple.com/app/id6785927095">Get LastHit on the App Store</a>
    </div>
    <small>Have the app? Tap “Open in LastHit”. New here? Get it on the App Store, then reopen this link to join.</small>
  </main>

  <script>
    const APP_STORE_URL = "https://apps.apple.com/app/id6785927095";

    function inviteCodeFromPath() {
      const parts = window.location.pathname.split("/").filter(Boolean);
      const markerIndex = parts.findIndex((part) => ["join", "invite"].includes(part.toLowerCase()));
      if (markerIndex >= 0 && parts[markerIndex + 1]) {
        return parts[markerIndex + 1].replace(/[^a-zA-Z0-9_-]/g, "");
      }
      const params = new URLSearchParams(window.location.search);
      return (params.get("code") || params.get("invite") || "").replace(/[^a-zA-Z0-9_-]/g, "");
    }

    const inviteCode = inviteCodeFromPath();
    const openLink = document.getElementById("open-link");
    const downloadLink = document.getElementById("download-link");
    const codeLabel = document.getElementById("invite-code");

    downloadLink.href = APP_STORE_URL;

    const deepLink = inviteCode ? `lasthit://join/${inviteCode}` : "lasthit://";
    openLink.href = deepLink;
    codeLabel.textContent = inviteCode
      ? `Invite code: ${inviteCode}`
      : "Open LastHit to join your group.";

    // If the app opens, the page is backgrounded — track that so we don't then
    // bounce an installed user to the App Store.
    let appOpened = false;
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") appOpened = true;
    });

    // Try to hand off to the app (covers users who reached this page instead of
    // being intercepted by the universal link, e.g. right after install).
    window.setTimeout(() => { window.location.href = deepLink; }, 350);

    // Still here after a moment? The app isn't installed — send them to get it.
    window.setTimeout(() => {
      if (!appOpened && document.visibilityState === "visible") {
        window.location.href = APP_STORE_URL;
      }
    }, 2500);
  </script>
</body>
</html>
